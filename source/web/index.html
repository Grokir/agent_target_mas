<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MAS Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1f26;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    background: #16171d;
    border-bottom: 1px solid #333;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  header input {
    flex: 1;
    background: #26272f;
    border: 1px solid #3a3b45;
    color: #eee;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #3a6df0;
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #2b2d38;
    border-bottom-left-radius: 2px;
  }
  .msg.assistant.thinking { opacity: 0.5; font-style: italic; }
  .msg.error {
    align-self: flex-start;
    background: #4a1f1f;
    color: #ffb3b3;
    border-bottom-left-radius: 2px;
  }
  .tag {
    display: block;
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #16171d;
    border-top: 1px solid #333;
  }
  form input {
    flex: 1;
    background: #26272f;
    border: 1px solid #3a3b45;
    color: #eee;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  form button {
    background: #3a6df0;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  form button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <span>API:</span>
  <input id="apiUrl" value="http://localhost:5000/chat">
</header>

<div id="chat"></div>

<form id="form">
  <input id="input" placeholder="Сообщение..." autocomplete="off">
  <button type="submit">Отправить</button>
</form>

<script>
  const sessionId = crypto.randomUUID();
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const apiUrlInput = document.getElementById("apiUrl");
  const button = form.querySelector("button");

  function addMessage(text, cls, tag) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (tag) {
      const tagEl = document.createElement("span");
      tagEl.className = "tag";
      tagEl.textContent = tag;
      div.appendChild(tagEl);
    }
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    input.disabled = true;
    button.disabled = true;
    addMessage(message, "user");

    const thinking = addMessage("...", "assistant thinking");

    try {
      const resp = await fetch(apiUrlInput.value, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });

      thinking.remove();

      if (!resp.ok) {
        addMessage(`HTTP ${resp.status}: ${resp.statusText}`, "error");
        return;
      }

      const data = await resp.json();
      const tag = data.status === "ready" && data.target_agent
        ? data.target_agent
        : data.status;
      addMessage(data.reply ?? "(пустой ответ)", "assistant", tag);
    } catch (err) {
      thinking.remove();
      addMessage(`Не удалось связаться с сервером: ${err.message}`, "error");
    } finally {
      input.disabled = false;
      button.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
